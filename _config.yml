# Jekyll Configuration
title: "Ayachi Yassine – Cybersecurity Pentesting Portfolio"
description: "Pentesting projects, reports, and security research"
theme: jekyll-theme-minimal

# Site settings
url: "https://Ayachi-Yassine.github.io"
baseurl: ""

# Author
author:
  name: "Ayachi Yassine"
  email: "your-email@example.com"

# Collections for organized content
collections:
  projects:
    output: true
    permalink: /projects/:title/
  writeups:
    output: true
    permalink: /writeups/:title/
  research:
    output: true
    permalink: /research/:title/

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Build settings
markdown: kramdown
highlighter: rouge

# Defaults
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: post
  - scope:
      path: ""
      type: writeups
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: post
